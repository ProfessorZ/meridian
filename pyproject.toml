[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
dynamic = ["version"]
description = "Dynamic DNS updater for AWS Route53 with IAM Roles Anywhere"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
    "httpx>=0.27",
    "loguru>=0.7",
    "boto3>=1.34",
]

[project.optional-dependencies]
panel = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]

[project.scripts]
meridian = "meridian.updater.main:main"
meridian-panel = "meridian.panel.main:run"

[tool.setuptools.dynamic]
version = {attr = "meridian.version.__version__"}
