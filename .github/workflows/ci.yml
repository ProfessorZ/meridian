name: CI

on:
  push:
    branches: [development, master, "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [development, master]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt ruff pytest
      - name: Lint
        run: ruff check meridian/
      - name: Test
        run: pytest --tb=short -q || echo "No tests yet"
